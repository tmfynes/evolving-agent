---
applications:
  - name: evolving-agent
    path: .
    buildpacks:
      - agent_buildpack
    stack: cflinuxfs4
    memory: 1G
    disk_quota: 2G
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 10
    routes:
      - route: evolving-agent.homelab1.fynesy.com
    metadata:
      labels:
        ai.tanzu.com/type: agent
    services:
      - qwen38
      - evolving-agent-github
    env:
      TANZU_AGENT_DISPLAY_NAME: Evolving Agent
      TANZU_AGENT_DESCRIPTION: Demo agent that turns a verbose teach-in into a GitHub-backed skill (PR or main).
      TANZU_AGENT_DEFAULT_MODEL: Qwen/Qwen3.8-27B-FP8
      TANZU_AGENT_GENAI_MODEL_NAME: Qwen/Qwen3.8-27B-FP8
      TANZU_AGENT_SHELL_ACCESS_ENABLED: "true"
      TANZU_AGENT_FILESYSTEM_ACCESS: read-write
      TANZU_AGENT_TOOL_PERMISSION_MODE: allow
      TANZU_AGENT_ENABLE_DEBUG_UI: "true"
      SKILLS_REPO_URL: https://github.com/tmfynes/evolving-agent.git
      SKILLS_REPO_BRANCH: main
      GIT_AUTHOR_NAME: Evolving Agent
      GIT_AUTHOR_EMAIL: tmfynes@yahoo.com
      TANZU_AGENT_WELCOME_SUGGESTION_1: Teach me a skill from a verbose example, then save it.
      TANZU_AGENT_WELCOME_SUGGESTION_2: Open a PR that updates taught-knowledge.
      TANZU_AGENT_WELCOME_SUGGESTION_3: Push this skill update straight to main.
      TANZU_AGENT_WELCOME_SUGGESTION_4: How do I persist something so next time I can ask in one line?
